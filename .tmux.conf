# ========================# =========================
# General Settings
# =========================

# Change prefix from Ctrl+b to Ctrl+a
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Enable mouse (click to select panes, scroll)
set -g mouse on

# Standard terminal settings for color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# =========================
# Splits and Navigation
# =========================

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Use vim-style keys for pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Use vi keys in copy mode
setw -g mode-keys vi
bind z resize-pane -Z

# Quick reload
bind r source-file ~/.tmux.conf \; display "✅ Reloaded ~/.tmux.conf"

# =========================
# OpenCode & Window Management
# =========================

# Smart Window Management: Create windows with project names
bind n command-prompt -p "Window Name:" "new-window -n '%%'"

# The "OpenCode Sidecar"
# Press Prefix + g to open a 30% vertical pane on the right and start OpenCode
bind g split-window -h -p 30 "opencode"

# Fast Workspace Switching (Using FZF)
TMUX_FZF_SESSION_FORMAT="#{session_name}"
bind s run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh"
bind f run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/window.sh"
bind p run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/pane.sh"
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# =========================
# Centered Tabs Layout
# =========================

set -g status-position top
set -g status-justify centre      # Center the windows
set -g status-bg default
set -g status-style bg=default

# LEFT: Session Info
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold] 󱂬 #S "

# RIGHT: Path & Time
set -g status-right-length 80
set -g status-right "#[fg=#9ece6a]󰉖 #{=20:pane_current_path} #[fg=#565f89]| #[fg=#bb9af7]%H:%M "

# CENTER: Window Tabs
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold,bg=#292e42]  #I:#W "

# Force transparency
set -g @tokyo-night-transparent true

# =========================
# Plugins
# =========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'olimorris/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'

# Auto-restore sessions
set -g @continuum-restore 'on'

# =========================
# Run TPM (Keep this at the very bottom)
# =========================

run '~/.tmux/plugins/tpm/tpm'
